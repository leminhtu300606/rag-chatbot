# Nginx edge cho RAG nội bộ: TLS + gzip + giới hạn upload + rate limit API
# Đặt cert nội bộ vào infra/nginx/certs/ (fullchain.pem + privkey.pem).
# Tự ký nội bộ: xem README.md mục 11.5
events { worker_connections 256; }

http {
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
  gzip on;
  gzip_types application/json text/css application/javascript;
  client_max_body_size 100m;

  upstream rag { server app:8000; }

  # HTTP -> HTTPS (giữ lại khi đã có cert; chưa có cert thì dùng block :80 proxy thẳng)
  server {
    listen 80;
    server_name _;
    location / { proxy_pass http://rag; proxy_set_headers Host $host; proxy_set_headers X-Forwarded-For $proxy_add_x_forwarded_for; }
  }

  # Bật block này khi đã có cert nội bộ:
  # server {
  #   listen 443 ssl;
  #   server_name rag.noibo.local;
  #   ssl_certificate /etc/nginx/certs/fullchain.pem;
  #   ssl_certificate_key /etc/nginx/certs/privkey.pem;
  #   add_header Strict-Transport-Security "max-age=31536000" always;
  #   location /api/ {
  #     limit_req zone=api burst=10 nodelay;
  #     proxy_pass http://rag;
  #     proxy_set_headers Host $host;
  #     proxy_set_headers X-Forwarded-For $proxy_add_x_forwarded_for;
  #     proxy_set_headers X-Forwarded-Proto https;
  #     proxy_read_timeout 300s;
  #   }
  #   location / {
  #     proxy_pass http://rag;
  #     proxy_set_headers Host $host;
  #   }
  # }
}
